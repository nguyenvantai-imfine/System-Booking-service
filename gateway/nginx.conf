events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    server {
        listen 80;
        server_name localhost;

        # CORS Headers tập trung
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # 1. User Service
        location /api/v1/auth/ {
            proxy_pass http://user-service:8001/api/v1/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/v1/users/ {
            proxy_pass http://user-service:8001/api/v1/users/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 2. Hotel Service
        location /api/v1/hotels/ {
            proxy_pass http://hotel-service:8000/api/v1/hotels/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 3. Room Service
        location /api/v1/rooms/ {
            proxy_pass http://room-service:8002/api/v1/rooms/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 4. Booking Service
        location /api/v1/bookings/ {
            proxy_pass http://booking-service:8003/api/v1/bookings/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 5. Payment Service
        location /api/v1/payments/ {
            proxy_pass http://payment-service:8004/api/v1/payments/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 6. Notification Service
        location /api/v1/notifications/ {
            proxy_pass http://notification-service:8005/api/v1/notifications/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Root Info
        location / {
            default_type application/json;
            return 200 '{"service":"API Gateway (Nginx)","status":"online","port":80}';
        }
    }
}
